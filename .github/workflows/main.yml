name: Build TREM BALA MOD IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run tests and build IPA
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build.sh tests/run_localization_tests.sh
          bash -n build.sh
          echo "Starting IPA build in: $PWD"
          bash ./build.sh 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          echo "IPA build step completed"
        env:
          WQ_SKIP_PREFLIGHT: "1"
          WQFILES_FINAL_IPA: ${{ github.workspace }}/TREM-BALA-MOD.ipa
          KEYAUTH_SECRET: ${{ secrets.KEYAUTH_SECRET }}
          KEYAUTH_OWNER_ID: ${{ secrets.KEYAUTH_OWNER_ID || vars.KEYAUTH_OWNER_ID }}
          KEYAUTH_APP_NAME: ${{ secrets.KEYAUTH_APP_NAME || vars.KEYAUTH_APP_NAME }}

      - name: Verify IPA output
        if: success()
        run: |
          set -euo pipefail
          ls -la "${{ github.workspace }}"
          test -f "${{ github.workspace }}/TREM-BALA-MOD.ipa"
          ls -lh "${{ github.workspace }}/TREM-BALA-MOD.ipa"

      - name: Diagnostic output on build failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo "Build or verification failed. Dumping safe diagnostics:"
          pwd
          ls -la
          ls -la "${{ github.workspace }}"
          if test -f "$GITHUB_WORKSPACE/build.log"; then
            echo "--- First build errors ---"
            grep -nEi "(^|[^a-z])(error|failed|failure|unable|missing|cannot|not found)([^a-z]|$)" "$GITHUB_WORKSPACE/build.log" | head -n 80
            echo "--- First 300 lines of build.log ---"
            head -n 300 "$GITHUB_WORKSPACE/build.log"
            echo "--- Last 300 lines of build.log ---"
            tail -n 300 "$GITHUB_WORKSPACE/build.log"
          else
            echo "build.log was not created"
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            ${{ github.workspace }}/build.log
            ${{ github.workspace }}/TREM-BALA-MOD.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TREM-BALA-MOD-ipa
          path: ${{ github.workspace }}/TREM-BALA-MOD.ipa
          if-no-files-found: error
          retention-days: 14
