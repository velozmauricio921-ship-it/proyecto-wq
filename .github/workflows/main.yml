name: Build WQ Files IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run tests and build IPA
        run: bash ./build.sh
        env:
          WQFILES_FINAL_IPA: ${{ github.workspace }}/WQFiles.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WQFiles-ipa
          path: WQFiles.ipa
          if-no-files-found: error
          retention-days: 14
