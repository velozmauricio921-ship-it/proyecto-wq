   - name: Run tests and build IPA
        run: bash ./build.sh
        env:
          WQ_SKIP_PREFLIGHT: "1"
          WQFILES_FINAL_IPA: ${{ github.workspace }}/TREM BALA MOD.ipa
          KEYAUTH_SECRET: ${{ secrets.KEYAUTH_SECRET }}
          KEYAUTH_OWNER_ID: ${{ secrets.KEYAUTH_OWNER_ID || vars.KEYAUTH_OWNER_ID }}
          KEYAUTH_APP_NAME: ${{ secrets.KEYAUTH_APP_NAME || vars.KEYAUTH_APP_NAME }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TREM BALA MOD-ipa
          path: TREM BALA MOD.ipa
          if-no-files-found: error
          retention-days: 14
